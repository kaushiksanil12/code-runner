# Global Rate Limiting Zone (10 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=execute_limit:10m rate=10r/m;

server {
    listen 80;
    server_name coderunner.pacewisdom.in;

    # Note: In a real environment, you should redirect 80 to 443 and handle SSL in a 443 block.
    # Assuming SSL termination happens here or upstream as per requirements:
    # listen 443 ssl;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # /execute Endpoint
    location /execute {
        # Apply Rate Limiting (burst=5 allows brief spikes but enforces the 10r/m average)
        limit_req zone=execute_limit burst=5 nodelay;

        # Strict body size limit for execution payload
        client_max_body_size 50k;

        proxy_pass http://secure-runner:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # /health Endpoint
    location /health {
        access_log off; # Disable logging for health checks to prevent disk spam
        proxy_pass http://secure-runner:8000;
        proxy_set_header Host $host;
    }

    # Catch-all
    location / {
        return 404;
    }
}
