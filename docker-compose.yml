services:
  secure-runner:
    image: secure-runner
    build:
      context: ./app
      network: host
    container_name: secure-code-runner
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - WORKERS=${WORKERS:-1}
      - API_KEY=${API_KEY}
      - AWS_REGION=us-east-1
      - LAMBDA_FUNCTION_NAME=SecureCodeRunner
      # Note: If not using an EC2 IAM Role, provide keys here:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    
    # Strictly unprivileged API server (No root, no caps needed)
    user: "10000:10000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - shared

networks:
  shared:
    external: true